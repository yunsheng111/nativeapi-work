# sync-upstream 定期同步上游 linguo2625469/workbuddy2api-panel：
# 有新提交且能自动合并 → 直接推回 main；冲突 → 本 workflow 失败，
# GitHub 会给仓库 Watcher 发失败通知（即“订阅提醒”），需人工解冲突。
name: sync-upstream

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时检查一次上游
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/linguo2625469/workbuddy2api-panel.git
          git fetch upstream main --tags
          if [ "$(git rev-parse main)" = "$(git rev-parse upstream/main)" ]; then
            echo "upstream 无新提交，跳过"
            exit 0
          fi
          echo "上游新提交："
          git log main..upstream/main --oneline || true
          git merge --no-edit upstream/main
          git push origin main
